<svg width="700" height="230" viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gradBasic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>
    <linearGradient id="gradEasy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#55efc4"/>
    </linearGradient>
    <linearGradient id="gradMedium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#ffc048"/>
    </linearGradient>
    <linearGradient id="gradHard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#ff7675"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clipBasic"><rect x="120" y="12" height="20" width="47.5" rx="8"/></clipPath>
    <clipPath id="clipEasy"><rect x="120" y="64" height="20" width="119.8" rx="8"/></clipPath>
    <clipPath id="clipMedium"><rect x="120" y="116" height="20" width="268.6" rx="8"/></clipPath>
    <clipPath id="clipHard"><rect x="120" y="168" height="20" width="64.0" rx="8"/></clipPath>
  </defs>

  <style>
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #24292f; }
    .count { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 800; }
    .footer { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #57606a; }
    .track { fill: #eef1f4; }

    .bar { animation: grow 1.4s cubic-bezier(.2,.8,.2,1) forwards; transform-origin: left; filter: url(#glow); }
    @keyframes grow {
      0% { transform: scaleX(0); opacity: 0.3; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    .b1 { animation-delay: 0.05s; }
    .b2 { animation-delay: 0.30s; }
    .b3 { animation-delay: 0.55s; }
    .b4 { animation-delay: 0.80s; }

    .sweep { animation: sweepMove 2.6s ease-in-out infinite; }
    @keyframes sweepMove {
      0%   { transform: translateX(-140px); }
      100% { transform: translateX(560px); }
    }
    .s1 { animation-delay: 1.5s; }
    .s2 { animation-delay: 1.8s; }
    .s3 { animation-delay: 2.1s; }
    .s4 { animation-delay: 2.4s; }

    .glowDot { animation: dotPulse 1.6s ease-in-out infinite; }
    @keyframes dotPulse {
      0%, 100% { r: 4; opacity: 1; }
      50% { r: 6; opacity: 0.5; }
    }
  </style>

  <!-- Basic -->
  <text x="0" y="27" class="label">🟢 Basic</text>
  <rect x="120" y="12" width="500" height="20" rx="8" class="track"/>
  <rect x="120" y="12" height="20" width="47.5" rx="8" fill="url(#gradBasic)" class="bar b1"/>
  <rect x="0" y="12" width="80" height="20" fill="url(#shimmer)" clip-path="url(#clipBasic)" class="sweep s1"/>
  <circle cx="640" cy="22" r="4" fill="#00c853" class="glowDot"/>
  <text x="655" y="27" class="count" fill="#00c853">23</text>

  <!-- Easy -->
  <text x="0" y="79" class="label">🟩 Easy</text>
  <rect x="120" y="64" width="500" height="20" rx="8" class="track"/>
  <rect x="120" y="64" height="20" width="119.8" rx="8" fill="url(#gradEasy)" class="bar b2"/>
  <rect x="0" y="64" width="80" height="20" fill="url(#shimmer)" clip-path="url(#clipEasy)" class="sweep s2"/>
  <circle cx="640" cy="74" r="4" fill="#00b894" class="glowDot"/>
  <text x="655" y="79" class="count" fill="#00b894">58</text>

  <!-- Medium -->
  <text x="0" y="131" class="label">🟠 Medium</text>
  <rect x="120" y="116" width="500" height="20" rx="8" class="track"/>
  <rect x="120" y="116" height="20" width="268.6" rx="8" fill="url(#gradMedium)" class="bar b3"/>
  <rect x="0" y="116" width="80" height="20" fill="url(#shimmer)" clip-path="url(#clipMedium)" class="sweep s3"/>
  <circle cx="640" cy="126" r="4" fill="#e67e22" class="glowDot"/>
  <text x="655" y="131" class="count" fill="#e67e22">130</text>

  <!-- Hard -->
  <text x="0" y="183" class="label">🔴 Hard</text>
  <rect x="120" y="168" width="500" height="20" rx="8" class="track"/>
  <rect x="120" y="168" height="20" width="64.0" rx="8" fill="url(#gradHard)" class="bar b4"/>
  <rect x="0" y="168" width="80" height="20" fill="url(#shimmer)" clip-path="url(#clipHard)" class="sweep s4"/>
  <circle cx="640" cy="178" r="4" fill="#e74c3c" class="glowDot"/>
  <text x="655" y="183" class="count" fill="#e74c3c">31</text>

  <text x="0" y="218" class="footer">Total: 242 problems solved &#160;·&#160; Coding Score: 895 &#160;·&#160; 72-day streak</text>
</svg>
