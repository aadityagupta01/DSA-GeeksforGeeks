<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #24292f; }
    .count { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; }
    .track { fill: #eaeef2; rx: 6; }

    .bar { rx: 6; animation: grow 1.6s ease-out forwards; transform-origin: left; }
    @keyframes grow {
      0% { transform: scaleX(0); opacity: 0.4; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    .basic  { fill: #2ecc71; animation-delay: 0.1s; }
    .easy   { fill: #27ae60; animation-delay: 0.35s; }
    .medium { fill: #f39c12; animation-delay: 0.6s; }
    .hard   { fill: #e74c3c; animation-delay: 0.85s; }

    .pulse { animation: pulseDot 1.8s ease-in-out infinite; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>

  <!-- Basic: 23 / 242 -->
  <text x="0" y="25" class="label">🟢 Basic</text>
  <rect x="120" y="12" width="500" height="18" class="track"/>
  <rect x="120" y="12" height="18" width="47.5" class="bar basic"/>
  <circle cx="640" cy="21" r="4" class="pulse basic"/>
  <text x="655" y="26" class="count" fill="#2ecc71">23</text>

  <!-- Easy: 58 / 242 -->
  <text x="0" y="75" class="label">🟩 Easy</text>
  <rect x="120" y="62" width="500" height="18" class="track"/>
  <rect x="120" y="62" height="18" width="119.8" class="bar easy"/>
  <circle cx="640" cy="71" r="4" class="pulse easy"/>
  <text x="655" y="76" class="count" fill="#27ae60">58</text>

  <!-- Medium: 130 / 242 -->
  <text x="0" y="125" class="label">🟠 Medium</text>
  <rect x="120" y="112" width="500" height="18" class="track"/>
  <rect x="120" y="112" height="18" width="268.6" class="bar medium"/>
  <circle cx="640" cy="121" r="4" class="pulse medium"/>
  <text x="655" y="126" class="count" fill="#f39c12">130</text>

  <!-- Hard: 31 / 242 -->
  <text x="0" y="175" class="label">🔴 Hard</text>
  <rect x="120" y="162" width="500" height="18" class="track"/>
  <rect x="120" y="162" height="18" width="64.0" class="bar hard"/>
  <circle cx="640" cy="171" r="4" class="pulse hard"/>
  <text x="655" y="176" class="count" fill="#e74c3c">31</text>

  <text x="0" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#57606a">
    Total: 242 problems solved · Coding Score: 895
  </text>
</svg>
